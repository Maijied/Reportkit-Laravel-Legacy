<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ReportKit loading">
  <title>ReportKit loader</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7a4b"/>
      <stop offset="1" stop-color="#8ef0c4"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none !important; }
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.65; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes dash {
      0% { stroke-dashoffset: 180; }
      100% { stroke-dashoffset: 0; }
    }
    .orbit { transform-origin: 64px 64px; animation: spin 1.4s linear infinite; }
    .core { transform-origin: 64px 64px; animation: breathe 1.4s ease-in-out infinite; }
    .arc { stroke-dasharray: 90 200; animation: dash 1.4s ease-in-out infinite; }
  ]]></style>

  <rect width="128" height="128" rx="28" fill="#0a1410"/>

  <circle cx="64" cy="64" r="46" fill="none" stroke="#1e3d2f" stroke-width="4"/>

  <g class="motion orbit">
    <circle class="motion arc" cx="64" cy="64" r="46" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" transform="rotate(-90 64 64)"/>
  </g>

  <g class="motion core">
    <circle cx="64" cy="64" r="18" fill="#0b7a4b"/>
    <circle cx="64" cy="64" r="6" fill="#8ef0c4"/>
    <rect x="58" y="44" width="12" height="8" rx="2" fill="#34c98a" opacity="0.9"/>
    <rect x="58" y="76" width="12" height="8" rx="2" fill="#f0ad4e" opacity="0.9"/>
  </g>
</svg>
