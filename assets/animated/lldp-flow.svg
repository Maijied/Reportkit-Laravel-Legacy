<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="LLDP flow  Prepare, Secure Store, Compose, Deliver">
  <title>LLDP phase flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060908"/>
      <stop offset="1" stop-color="#0d1a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7a4b"/>
      <stop offset="1" stop-color="#34c98a"/>
    </linearGradient>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22a06b" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34c98a"/>
    </marker>
  </defs>

  <style><![CDATA[
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none !important; opacity: 1; }
      .pulse-ring { opacity: 0; }
    }
    @keyframes phaseActive {
      0%, 18% { stroke: #1e3d2f; fill: #0f1512; }
      22%, 38% { stroke: #34c98a; fill: #122018; filter: url(#cardGlow); }
      42%, 100% { stroke: #1e3d2f; fill: #0f1512; filter: none; }
    }
    @keyframes labelActive {
      0%, 18% { fill: #7a8f84; }
      22%, 38% { fill: #8ef0c4; }
      42%, 100% { fill: #7a8f84; }
    }
    @keyframes arrowFlow {
      0%, 20% { stroke-dashoffset: 24; opacity: 0.25; }
      30%, 45% { stroke-dashoffset: 0; opacity: 1; }
      55%, 100% { stroke-dashoffset: -24; opacity: 0.25; }
    }
    @keyframes dotTravel {
      0% { offset-distance: 0%; opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes pulseRing {
      0%, 100% { r: 34; opacity: 0; }
      22%, 38% { r: 42; opacity: 0.35; }
    }
    .p-prepare { animation: phaseActive 8s ease-in-out infinite; }
    .l-prepare { animation: labelActive 8s ease-in-out infinite; }
    .p-store { animation: phaseActive 8s ease-in-out infinite 2s; }
    .l-store { animation: labelActive 8s ease-in-out infinite 2s; }
    .p-compose { animation: phaseActive 8s ease-in-out infinite 4s; }
    .l-compose { animation: labelActive 8s ease-in-out infinite 4s; }
    .p-deliver { animation: phaseActive 8s ease-in-out infinite 6s; }
    .l-deliver { animation: labelActive 8s ease-in-out infinite 6s; }
    .a1 { stroke-dasharray: 24 12; animation: arrowFlow 8s ease-in-out infinite 1s; }
    .a2 { stroke-dasharray: 24 12; animation: arrowFlow 8s ease-in-out infinite 3s; }
    .a3 { stroke-dasharray: 24 12; animation: arrowFlow 8s ease-in-out infinite 5s; }
    .travel-dot { offset-path: path('M 210 120 L 750 120'); animation: dotTravel 8s linear infinite; }
    .ring-prepare { animation: pulseRing 8s ease-in-out infinite; }
    .ring-store { animation: pulseRing 8s ease-in-out infinite 2s; }
    .ring-compose { animation: pulseRing 8s ease-in-out infinite 4s; }
    .ring-deliver { animation: pulseRing 8s ease-in-out infinite 6s; }
  ]]></style>

  <rect width="960" height="240" rx="20" fill="url(#bg)"/>
  <text x="32" y="36" font-family="Manrope, Inter, sans-serif" font-size="14" font-weight="700" fill="#34c98a" letter-spacing="3">LORAPOK LABS DESIGN PATTERN</text>
  <text x="32" y="62" font-family="Sora, Manrope, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Prepare ’ Secure Store ’ Compose ’ Deliver</text>

  <!-- phase cards -->
  <g transform="translate(48 96)">
    <circle class="motion pulse-ring ring-prepare" cx="72" cy="48" fill="none" stroke="#34c98a" stroke-width="2"/>
    <rect class="motion p-prepare" x="0" y="0" width="144" height="96" rx="16" stroke-width="2"/>
    <text x="72" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" class="motion l-prepare">P</text>
    <text x="72" y="68" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#9fb3aa">Prepare</text>

    <rect class="motion p-store" x="224" y="0" width="144" height="96" rx="16" stroke-width="2"/>
    <circle class="motion pulse-ring ring-store" cx="296" cy="48" fill="none" stroke="#34c98a" stroke-width="2"/>
    <text x="296" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" class="motion l-store">S</text>
    <text x="296" y="68" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#9fb3aa">Secure Store</text>

    <rect class="motion p-compose" x="448" y="0" width="144" height="96" rx="16" stroke-width="2"/>
    <circle class="motion pulse-ring ring-compose" cx="520" cy="48" fill="none" stroke="#34c98a" stroke-width="2"/>
    <text x="520" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" class="motion l-compose">C</text>
    <text x="520" y="68" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#9fb3aa">Compose</text>

    <rect class="motion p-deliver" x="672" y="0" width="144" height="96" rx="16" stroke-width="2"/>
    <circle class="motion pulse-ring ring-deliver" cx="744" cy="48" fill="none" stroke="#34c98a" stroke-width="2"/>
    <text x="744" y="38" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" class="motion l-deliver">D</text>
    <text x="744" y="68" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#9fb3aa">Deliver</text>
  </g>

  <!-- connectors -->
  <path class="motion a1" d="M 192 144 L 224 144" fill="none" stroke="#34c98a" stroke-width="3" marker-end="url(#arrow)"/>
  <path class="motion a2" d="M 416 144 L 448 144" fill="none" stroke="#34c98a" stroke-width="3" marker-end="url(#arrow)"/>
  <path class="motion a3" d="M 640 144 L 672 144" fill="none" stroke="#34c98a" stroke-width="3" marker-end="url(#arrow)"/>

  <circle class="motion travel-dot" r="5" fill="#8ef0c4"/>

  <text x="48" y="220" font-family="Manrope, sans-serif" font-size="13" fill="#5f7369">Zero re-query on compose · encrypted browser store · week-chunked prepare</text>
</svg>
