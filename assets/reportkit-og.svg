<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ReportKit">
  <title>ReportKit — Multi-Database Report Engine</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060908"/>
      <stop offset="0.45" stop-color="#0a1410"/>
      <stop offset="1" stop-color="#0d1a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b7a4b"/>
      <stop offset="1" stop-color="#34c98a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.04"/>
      <circle cx="24" cy="24" r="1" fill="#22a06b" opacity="0.08"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22a06b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22a06b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- left icon card -->
  <g transform="translate(72 88)" filter="url(#cardShadow)">
    <rect width="420" height="454" rx="28" fill="#0f1512" stroke="#1e3d2f" stroke-width="1.5"/>
    <rect x="18" y="18" width="384" height="418" rx="22" fill="url(#iconGlow)"/>
    <g transform="translate(36 34) scale(0.68)">
      <rect width="512" height="512" rx="112" fill="#0a1410"/>
      <rect x="1.5" y="1.5" width="509" height="509" rx="110" fill="none" stroke="#1e3d2f" stroke-width="2"/>
      <g fill="#151b20" stroke="#243038" stroke-width="2">
        <ellipse cx="390" cy="198" rx="30" ry="20" transform="rotate(32 390 198)"/>
        <ellipse cx="418" cy="268" rx="30" ry="20" transform="rotate(72 418 268)"/>
        <ellipse cx="384" cy="346" rx="30" ry="20" transform="rotate(118 384 346)"/>
        <ellipse cx="128" cy="346" rx="30" ry="20" transform="rotate(-118 128 346)"/>
        <ellipse cx="94" cy="268" rx="30" ry="20" transform="rotate(-72 94 268)"/>
      </g>
      <g transform="translate(352 132)">
        <ellipse cx="0" cy="0" rx="36" ry="28" fill="#151b20" stroke="#243038" stroke-width="2"/>
        <ellipse cx="-11" cy="-3" rx="8" ry="10" fill="#8ef0c4"/>
        <ellipse cx="11" cy="-3" rx="8" ry="10" fill="#8ef0c4"/>
      </g>
      <g transform="translate(118 138) scale(0.66)">
        <path d="M 164,180 C 224,180 236,256 296,256" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.92"/>
        <path d="M 164,332 C 224,332 236,256 296,256" fill="none" stroke="#f0ad4e" stroke-width="16" stroke-linecap="round"/>
        <path d="M 60,138 L 60,222 A 52,17 0 0 0 164,222 L 164,138 Z" fill="#ffffff"/>
        <ellipse cx="112" cy="138" rx="52" ry="17" fill="#8ef0c4"/>
        <path d="M 60,290 L 60,374 A 52,17 0 0 0 164,374 L 164,290 Z" fill="#f0ad4e"/>
        <ellipse cx="112" cy="290" rx="52" ry="17" fill="#f8cd8a"/>
        <circle cx="296" cy="256" r="22" fill="#ffffff"/>
        <circle cx="296" cy="256" r="8" fill="#0b7a4b"/>
        <path d="M 296,256 L 452,256" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
        <path d="M 314,256 L 314,208 Q 314,196 326,196 L 332,196 Q 344,196 344,208 L 344,256 Z" fill="#8ef0c4"/>
        <path d="M 362,256 L 362,170 Q 362,158 374,158 L 380,158 Q 392,158 392,170 L 392,256 Z" fill="#34c98a"/>
        <path d="M 410,256 L 410,132 Q 410,120 422,120 L 428,120 Q 440,120 440,132 L 440,256 Z" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- right copy block -->
  <g transform="translate(548 118)">
    <text x="0" y="0" font-family="Manrope, Inter, sans-serif" font-size="18" font-weight="700" fill="#34c98a" letter-spacing="4">LORAPOK LABS</text>
    <text x="0" y="92" font-family="Sora, Manrope, sans-serif" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="-2">Report<tspan fill="#8ef0c4">Kit</tspan></text>
    <rect x="0" y="112" width="260" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="168" font-family="Manrope, Inter, sans-serif" font-size="24" font-weight="700" fill="#d7e5de" letter-spacing="2.5">MULTI-DATABASE REPORT ENGINE</text>
    <text x="0" y="228" font-family="Manrope, Inter, sans-serif" font-size="34" font-weight="500" fill="#9fb3aa">Prepare once. Export at scale.</text>
    <text x="0" y="276" font-family="Manrope, Inter, sans-serif" font-size="34" font-weight="500" fill="#9fb3aa">Zero re-query on compose.</text>

    <!-- capability pills -->
    <g transform="translate(0 324)">
      <rect x="0" y="0" width="148" height="42" rx="21" fill="#101815" stroke="#1e3d2f"/>
      <text x="74" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#8ef0c4">PHP 5.6+</text>
      <rect x="164" y="0" width="232" height="42" rx="21" fill="#101815" stroke="#1e3d2f"/>
      <text x="280" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#8ef0c4">Laravel 4.1 → all</text>
      <rect x="412" y="0" width="220" height="42" rx="21" fill="#101815" stroke="#1e3d2f"/>
      <text x="522" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#8ef0c4">PREPARE · STORE · EXPORT</text>
    </g>

    <text x="0" y="430" font-family="Manrope, Inter, sans-serif" font-size="20" fill="#5f7369">reportkit.lorapok.tech</text>
  </g>
</svg>
