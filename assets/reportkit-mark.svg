<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 96 448 319" width="448" height="319" role="img" aria-label="ReportKit">
  <title>ReportKit</title>
  <desc>Two data sources merging into a single report.</desc>

  <!-- stream: live source -->
  <path d="M 164,180 C 224,180 236,256 296,256" fill="none" stroke="#0b7a4b" stroke-width="16" stroke-linecap="round"/>
  <!-- stream: archive source -->
  <path d="M 164,332 C 224,332 236,256 296,256" fill="none" stroke="#f0ad4e" stroke-width="16" stroke-linecap="round"/>

  <!-- in-flight rows -->
  <circle cx="230" cy="218" r="4.5" fill="#8ef0c4"/>
  <circle cx="230" cy="294" r="4.5" fill="#ffe0ad"/>

  <!-- live database -->
  <path d="M 60,138 L 60,222 A 52,17 0 0 0 164,222 L 164,138 Z" fill="#0b7a4b"/>
  <path d="M 60,180 A 52,17 0 0 0 164,180" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>
  <ellipse cx="112" cy="138" rx="52" ry="17" fill="#34c98a"/>

  <!-- archive database -->
  <path d="M 60,290 L 60,374 A 52,17 0 0 0 164,374 L 164,290 Z" fill="#f0ad4e"/>
  <path d="M 60,332 A 52,17 0 0 0 164,332" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="6"/>
  <ellipse cx="112" cy="290" rx="52" ry="17" fill="#f8cd8a"/>

  <!-- merge node -->
  <circle cx="296" cy="256" r="22" fill="#0b7a4b"/>
  <circle cx="296" cy="256" r="8" fill="#8ef0c4"/>

  <!-- report baseline -->
  <path d="M 296,256 L 452,256" fill="none" stroke="#0b7a4b" stroke-width="16" stroke-linecap="round"/>

  <!-- report bars -->
  <path d="M 314,256 L 314,208 Q 314,196 326,196 L 332,196 Q 344,196 344,208 L 344,256 Z" fill="#8ef0c4"/>
  <path d="M 362,256 L 362,170 Q 362,158 374,158 L 380,158 Q 392,158 392,170 L 392,256 Z" fill="#34c98a"/>
  <path d="M 410,256 L 410,132 Q 410,120 422,120 L 428,120 Q 440,120 440,132 L 440,256 Z" fill="#0b7a4b"/>
</svg>
